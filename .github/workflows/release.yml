name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r windows/requirements.txt pyinstaller
      - name: Build exe
        run: >
          pyinstaller --onefile --noconsole --name SpotyAdX
          --icon windows/icon.ico --add-data "windows/icon.ico;."
          --collect-all pycaw --collect-all comtypes
          windows/ad_muter.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/SpotyAdX.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        working-directory: android-app
        run: npm ci
      - name: Generate native project
        working-directory: android-app
        run: npx expo prebuild -p android --no-install --clean
      - name: Build apk
        working-directory: android-app/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Rename apk
        run: cp android-app/android/app/build/outputs/apk/release/app-release.apk SpotyAdX.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: SpotyAdX.apk

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - name: Build app
        run: >
          pyinstaller --windowed --name "Spoty Ad X"
          --icon mac/icon.icns
          --osx-bundle-identifier com.spoty.adx
          mac/ad_muter_mac.py
      - name: Add Automation permission text and sign
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSAppleEventsUsageDescription string 'Spoty Ad X needs to talk to Spotify to detect ads and mute them.'" "dist/Spoty Ad X.app/Contents/Info.plist"
          codesign --force --deep --sign - "dist/Spoty Ad X.app"
      - name: Zip
        run: ditto -c -k --keepParent "dist/Spoty Ad X.app" SpotyAdX-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: SpotyAdX-mac.zip

  release:
    needs: [windows, android, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest out/SpotyAdX.exe out/SpotyAdX.apk out/SpotyAdX-mac.zip \
            --title "Spoty Ad X" \
            --notes "Windows: SpotyAdX.exe. Android: SpotyAdX.apk. Mac: SpotyAdX-mac.zip."
